<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photrix — offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f7f7;
        color: #242424;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #11161d; color: #eef2f7; }
        p { color: #8f99a8; }
      }
      main { padding: 24px; max-width: 360px; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { margin: 0 0 20px; color: #616161; font-size: 14px; }
      button {
        font: inherit;
        padding: 8px 20px;
        border: 0;
        border-radius: 4px;
        background: #0f6cbd;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Photrix needs a connection to reach your photos.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
