# Every PR into master must pass these before it is merged. Mark the `checks`
# and `e2e` jobs as required status checks on master (repo Settings → Rules) so
# GitHub enforces it rather than relying on someone reading the result.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the public-repo guard diffs against the PR base
      - uses: ./.github/actions/setup
      - name: Public-repo guard (no private addresses in added lines)
        if: github.event_name == 'pull_request'
        run: node scripts/check-public-repo.mjs "origin/${{ github.base_ref }}"
      - run: bun run typecheck
      - run: bun run lint
      - name: Server unit tests
        working-directory: server
        run: bun run test --forceExit
      - name: Client tests
        working-directory: client
        run: bun run test
      - run: bun run build:server
      - run: bun run build:client

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
