name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun does not run better-sqlite3's install script, so its native addon is built explicitly for server tests.
      - name: Build native addon
        run: node scripts/setup-native.mjs

      - name: Install ffmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r server/src/imageProcessing/requirements.txt

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Client unit tests
        run: bun run --filter photrix-client test

      - name: Server unit tests
        run: bun run test

      # e2e (`bun run test:e2e`) is not run here: it needs Playwright browsers installed (see TESTING.md).
